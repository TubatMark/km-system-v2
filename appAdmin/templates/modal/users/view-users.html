<!-- View User Modal -->
<div class="modal fade" id="viewAccountModal" tabindex="-1" role="dialog" aria-labelledby="viewAccountModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewAccountModalLabel">User Details</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form>
            <!-- User Information -->
            <div class="fieldset">
              <legend class="legend">Personal Information</legend>
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="view_first_name">First Name</label>
                  <input type="text" class="form-control view-modal" id="view_first_name" readonly>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="view_middle_name">Middle Name</label>
                  <input type="text" class="form-control view-modal" id="view_middle_name" readonly>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="view_last_name">Last Name</label>
                  <input type="text" class="form-control view-modal" id="view_last_name" readonly>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="view_sex">Biological Sex</label>
                  <input type="text" class="form-control view-modal" id="view_sex" readonly>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="view_gender">Gender</label>
                  <input type="text" class="form-control view-modal" id="view_gender" readonly>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="view_date_birth">Date of Birth</label>
                  <input type="text" class="form-control view-modal" id="view_date_birth" readonly>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="view_contact_num">Contact Number</label>
                  <input type="text" class="form-control view-modal" id="view_contact_num" readonly>
                </div>
              </div>
            </div>

            <!-- Account Information -->
            <div class="fieldset">
              <legend class="legend">Account Information</legend>
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label for="view_email">Email</label>
                  <input type="email" class="form-control view-modal" id="view_email" readonly>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="view_user_type">User Type</label>
                  <input type="text" class="form-control view-modal" id="view_user_type" readonly>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="view_id">User ID</label>
                  <input type="text" class="form-control view-modal" id="view_id" readonly>
                </div>
              </div>
            </div>

            <!-- Professional Information -->
            <div class="fieldset">
              <legend class="legend">Professional Information</legend>
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label for="view_institution">Institution</label>
                  <input type="text" class="form-control view-modal" id="view_institution" readonly>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="view_position">Position</label>
                  <input type="text" class="form-control view-modal" id="view_position" readonly>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="view_highest_educ">Highest Education</label>
                  <input type="text" class="form-control view-modal" id="view_highest_educ" readonly>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label for="view_specialization">Specialization</label>
                  <input type="text" class="form-control view-modal" id="view_specialization" readonly>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
